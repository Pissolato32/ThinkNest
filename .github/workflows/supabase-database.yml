name: Supabase Database

on:
  pull_request:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-database.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-database.yml"

permissions:
  contents: read

concurrency:
  group: supabase-database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --no-seed

      - name: Lint local database
        run: supabase db lint --local --level error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
