name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Generate Flutter platform scaffolding
        run: flutter create . --platforms=android,web --no-pub

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Verify formatting
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee dart-format.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git diff -- lib test
            dart format lib test >/dev/null
            echo "Formatter diff:"
            git diff -- lib test
          fi
          exit $status

      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-diagnostics-${{ github.run_id }}
          path: |
            flutter-analyze.log
            flutter-test.log
            dart-format.log
          if-no-files-found: ignore
          retention-days: 7
