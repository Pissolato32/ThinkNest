name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          cache: true

      - name: Generate Flutter platform scaffolding
        run: flutter create . --platforms=android,ios,web --no-pub

      - name: Configure voice platform permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
          if "android.permission.RECORD_AUDIO" not in text:
              insert = text.index(">", text.index("<manifest")) + 1
              text = text[:insert] + "\n" + permission + text[insert:]
          manifest.write_text(text)

          plist = Path("ios/Runner/Info.plist")
          text = plist.read_text()
          additions = """
            <key>NSMicrophoneUsageDescription</key>
            <string>O ThinkNest usa o microfone para capturar ideias por voz.</string>
            <key>NSSpeechRecognitionUsageDescription</key>
            <string>O ThinkNest usa reconhecimento de fala para transcrever ideias.</string>
          """
          if "NSMicrophoneUsageDescription" not in text:
              text = text.replace("</dict>", additions + "\n</dict>")
          plist.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Verify formatting
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee dart-format.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git diff -- lib test
            dart format lib test >/dev/null
            echo "Formatter diff:"
            git diff -- lib test
          fi
          exit $status

      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Test
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-diagnostics-${{ github.run_id }}
          path: |
            flutter-analyze.log
            flutter-test.log
            dart-format.log
          if-no-files-found: ignore
          retention-days: 7
